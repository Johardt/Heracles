description='''
An unofficial NeoForge-only port of Heracles for Minecraft 26.2.

Heracles is a comprehensive questing mod that lets pack makers create
tree-style quests distributed through the config folder. This port is not
affiliated with or supported by the original Heracles maintainers.
'''

